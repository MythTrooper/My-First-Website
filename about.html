<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
</head>
<body>
    <header>
        <h1>The About Page</h1>
    </header>
    <section>
        <form method="post" action="https://webdevbasics.net/scripts/demo.php">
            <div>
                <label for="myName">Name:</label>
                <input type="text" id="myName" name="myName">
            </div>
            <div>
                <label for="myEmail">Email:</label>
                <input type="text" id="myEmail" name="myEmail">
            </div>
            Choose the browsers you use<br>
            <div>
                <input type="checkbox" id="go" name="go" value="yes">
                <label for="go">Google Chrome</label>
            </div>
            <div>
                <input type="checkbox" id="firefox" name="firefox" value="yes">
                <label for="firefox">Firefox</label>
            </div>
            <div>
                <input type="checkbox" id="edge" name="edge" value="yes">
                <label for="edge">Microsoft Edge</label>
            </div>
            Would you like to be on our mailing list?<br>
            <div>
                <div>
                    <input type="radio" id="mailinglistyes" name="mailinglist" value="yes">
                    <label for="mailinglistyes">Yes</label>
                </div>
                <div>
                    <input type="radio" id="mailinglistno" name="mailingList" value="yes">
                    <label for="mailinglistno">No</label>
                </div>
            </div>
            <div>
                <span>Comments:</span>
                <textarea></textarea>
            </div>
                <input type="submit" value="Submit">
                <input type="reset">
        </form>
    </section>
</body>
</html>
